name: Deploy to GitHub Pages

on:
  push:
    branches: main
  # lets you run it by hand from the Actions tab, e.g. for the first deploy
  # after switching Pages on
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# and to let the "Commit version bump" step push the version bump back to main
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # The version-bump step below pushes a "[skip ci]" commit back to main;
    # this guard stops that push from re-triggering the workflow.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bump version in package.json
        run: yarn bump-version

      - name: Type check
        run: yarn run check

      - name: Test
        run: yarn test

      - name: Build project
        run: yarn build

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Commit version bump
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json
          git diff --staged --quiet || git commit -m "chore: bump version to v${VERSION} [skip ci]"
          git push
