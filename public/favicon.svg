<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>eng-tense-aspect</title>
  <!-- Two chevrons stepping forward and up: tense is movement through time.
       They are offset rather than aligned so the mark reads as motion instead
       of a "next" button. The middle stop matches the app title colour. -->
  <defs>
    <linearGradient id="chevron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <!-- Heavy strokes filling most of the canvas: at a 16px browser tab anything
       thinner washes out into antialiasing. Much past this and the notch
       between the two arms closes up. -->
  <g
    fill="none"
    stroke="url(#chevron)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M10 23 26 39 10 55" />
    <path d="M36 9 52 25 36 41" />
  </g>
</svg>
